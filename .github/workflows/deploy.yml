name: Deploy to Hostinger

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Usuario App
      working-directory: ./apps/usuario
      run: |
        npm install
        npm run build

    - name: Build Admin App
      working-directory: ./apps/admin
      run: |
        npm install
        npm run build

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: 'placeholder'

    - name: Adding Known Hosts
      run: ssh-keyscan -p 65002 -H 212.1.208.197 >> ~/.ssh/known_hosts

    - name: Create remote directories if they don't exist
      run: |
        ssh -p 65002 u359755993@212.1.208.197 "mkdir -p /home/u359755993/public_html/wp-content/plugins/puerto-core"
        ssh -p 65002 u359755993@212.1.208.197 "mkdir -p /home/u359755993/public_html/wp-content/uploads/puerto-app"

    - name: Deploy Plugin to Hostinger
      run: |
        rsync -avz -e "ssh -p 65002" ./puerto-core/ u359755993@212.1.208.197:/home/u359755993/public_html/wp-content/plugins/puerto-core/

    - name: Deploy Frontends to Hostinger
      run: |
        rsync -avz -e "ssh -p 65002" ./apps/usuario/dist/ u359755993@212.1.208.197:/home/u359755993/public_html/wp-content/uploads/puerto-app/
        rsync -avz -e "ssh -p 65002" ./apps/admin/dist/ u359755993@212.1.208.197:/home/u359755993/public_html/wp-content/uploads/puerto-app/